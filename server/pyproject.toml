[project]
name = "bookmycook"
version = "0.1.0"
description = "Tamil Nadu's premier platform for booking chefs, catering services, and decoration management for events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "flask-cors>=4.0.0",
    "flask-jwt-extended>=4.6.0",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "flask-limiter>=4.1.1",
    "marshmallow>=4.3.0",
    "flask-talisman>=1.1.0",
    "cryptography>=46.0.7",
    "pyotp>=2.9.0",
    "qrcode>=8.2",
    "flask-wtf>=1.3.0",
    "requests>=2.33.1",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2.3",
    "reportlab>=4.4.10",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
